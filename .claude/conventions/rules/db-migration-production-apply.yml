statement: "Migration PRs include flattened SQL for review; production is applied manually before deploy only when the change can exceed the 30-second startup timeout or lock a hot table, with that recommendation and its reason in the plan and PR; the executed production file is generated after merge by /migration-script from parked master; staging always applies at startup."
