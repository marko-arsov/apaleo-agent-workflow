statement: "Prefer default core/decision when write-every on request ∪ resource (or read-some) is already the right axis. When several endpoints share a non-default allow/deny, expose one named *_decision and point every [OpaAuthorization(decisionPath: ...)] at it rather than adding per-endpoint allow_*/decision_* files that only rename a shared helper."
